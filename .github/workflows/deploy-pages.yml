name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Prepare clean route URLs
        run: npm run pages:prepare

      - name: Verify exported pages
        run: |
          test -f dist/client/index.html
          test -f dist/client/koica/index.html
          test -f dist/client/koica-2/index.html
          test -f dist/client/유윌/index.html
          test -f dist/client/원하나/index.html
          test -f dist/client/터틀링/index.html
          test -f dist/client/그루/index.html
          test -f dist/client/국중도/index.html
          test -f dist/client/404.html
          test -n "$(find dist/client/_next/static -type f -print -quit)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
